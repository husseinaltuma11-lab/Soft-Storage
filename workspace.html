
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf3e9">
<meta name="description" content="Your quiet space for notes, projects and ideas.">
<title>Soft Storage — Your Workspace</title>

<style>
:root {
  --green: #708b72;
  --dark: #405b45;
  --text: #344638;
  --muted: #788779;
  --line: rgba(112,139,114,.20);
  --glass: rgba(255,255,255,.76);
  --border: rgba(255,255,255,.86);
  --surface: #f7faf5;
  --danger: #a56d6b;
  --radius: 22px;
  --shadow: 0 8px 26px rgba(65,91,65,.07);
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  color-scheme: light;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 18px;
  font: 15px/1.5 Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 12% 18%,
      rgba(170,202,168,.58), transparent 43%),
    radial-gradient(ellipse at 85% 20%,
      rgba(239,245,231,.8), transparent 42%),
    linear-gradient(135deg,#f8faf5,#e4eee1,#f5f7f0);
  background-attachment: scroll;
}

html:not(.authenticated) body {
  visibility: hidden;
}

button, input, textarea, select {
  font: inherit;
}

button { cursor: pointer; }

button:disabled {
  cursor: wait;
  opacity: .65;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(88,124,91,.45);
  outline-offset: 3px;
}

.app {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto;
}

.glass {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

header {
  padding: 30px 20px;
  margin-bottom: 20px;
  text-align: center;
}

.eyebrow {
  color: var(--green);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

h1 {
  margin: 12px 0;
  color: #425c47;
  font: normal clamp(36px,7vw,60px)/1.1 Georgia,serif;
  letter-spacing: -2px;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.search {
  flex: 1;
  min-width: 0;
}

input, textarea, select {
  width: 100%;
  padding: 12px 14px;
  color: var(--text);
  background: rgba(255,255,255,.84);
  border: 1px solid var(--line);
  border-radius: 13px;
}

input::placeholder, textarea::placeholder {
  color: #8a998b;
}

input:focus, textarea:focus, select:focus {
  border-color: #829d80;
  outline: none;
}

.primary {
  padding: 12px 18px;
  color: white;
  background: linear-gradient(135deg,#829d80,#5e7d62);
  border: 0;
  border-radius: 13px;
  white-space: nowrap;
}

.primary:hover {
  background: #58765c;
}

.logout {
  padding: 11px 14px;
  color: var(--dark);
  background: rgba(255,255,255,.65);
  border: 1px solid var(--line);
  border-radius: 13px;
  white-space: nowrap;
}

.tabs {
  display: flex;
  gap: 5px;
  padding: 8px;
  margin-bottom: 26px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
}

.tab {
  flex: 0 0 auto;
  padding: 10px 15px;
  color: #718273;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 11px;
  white-space: nowrap;
}

.tab:hover {
  background: rgba(255,255,255,.45);
}

.tab.active {
  color: var(--dark);
  background: #fff;
  border-color: var(--border);
}

.heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 24px 3px 15px;
}

.heading h2 {
  margin: 0;
  font: normal 25px Georgia,serif;
}

.count, .date {
  color: #849385;
  font-size: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(min(100%,235px),1fr));
  gap: 15px;
  align-items: stretch;
}

.note {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 185px;
  padding: 19px;
  overflow-wrap: anywhere;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 20px;
  box-shadow: 0 4px 16px rgba(65,91,65,.045);
}

.top, .bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.top { margin-bottom: 14px; }

.category {
  padding: 5px 9px;
  color: #557658;
  background: #dcebd8;
  border-radius: 20px;
  font-size: 10px;
  letter-spacing: .7px;
  text-transform: uppercase;
}

.fav {
  flex: 0 0 auto;
  padding: 0 3px;
  color: #9aa899;
  background: transparent;
  border: 0;
  font-size: 22px;
  line-height: 1.2;
}

.fav.yes { color: #b47776; }

.note h3 {
  margin: 0 0 9px;
  color: var(--dark);
  font: normal 21px/1.3 Georgia,serif;
  overflow-wrap: anywhere;
}

.note p {
  margin: 0;
  color: #68796a;
  font-size: 13px;
  line-height: 1.75;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bottom {
  align-items: flex-end;
  margin-top: auto;
  padding-top: 20px;
}

.date { font-size: 11px; }

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
}

.small {
  padding: 7px 9px;
  color: #607761;
  background: rgba(255,255,255,.8);
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 11px;
}

.small:hover, .logout:hover {
  background: white;
}

.delete { color: var(--danger); }

.empty {
  grid-column: 1 / -1;
  padding: 45px 20px;
  color: #809181;
  text-align: center;
}

.empty .symbol {
  color: var(--green);
  font-size: 25px;
}

.empty h3 {
  margin: 10px 0;
  color: #526d55;
  font: normal 24px Georgia,serif;
}

.empty p {
  margin: 0 auto 18px;
  max-width: 340px;
  font-size: 13px;
  line-height: 1.7;
}

footer {
  padding: 30px 10px 10px;
  color: #8a9a89;
  font-size: 11px;
  text-align: center;
}

dialog {
  width: min(500px,calc(100% - 28px));
  max-height: min(85vh,750px);
  padding: 0;
  overflow-y: auto;
  color: var(--text);
  background: #f5f9f2;
  border: 1px solid white;
  border-radius: 22px;
  box-shadow: 0 20px 60px rgba(44,66,45,.18);
}

dialog::backdrop {
  background: rgba(48,67,49,.32);
}

.form { padding: 25px; }

.form h2 {
  margin: 0 0 22px;
  font: normal 27px Georgia,serif;
}

.field { margin-bottom: 16px; }

.field label {
  display: block;
  margin-bottom: 7px;
  color: #6c806e;
  font-size: 12px;
}

textarea {
  min-height: 150px;
  resize: vertical;
  line-height: 1.65;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 20px;
}

.cancel {
  padding: 11px 16px;
  color: #607761;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.toast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 5;
  max-width: calc(100% - 36px);
  padding: 13px 17px;
  color: var(--dark);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}

.toast[hidden] { display: none; }

@media (hover: hover) and (pointer: fine) {
  .note:hover {
    border-color: rgba(112,139,114,.3);
  }
}

@media (max-width: 560px) {
  body { padding: 16px 11px; }

  header {
    padding: 25px 14px;
    margin-bottom: 15px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 9px;
  }

  .search { grid-column: 1 / -1; }

  .toolbar .primary,
  .toolbar .logout {
    width: 100%;
    padding: 12px 10px;
  }

  .tabs {
    gap: 3px;
    margin-bottom: 20px;
  }

  .tab {
    padding: 10px 12px;
    font-size: 12px;
  }

  .heading h2 { font-size: 23px; }

  .grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .note { min-height: 160px; }

  .form { padding: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="app">
  <header class="glass">
    <div class="eyebrow">Your little corner of the internet</div>
    <h1>Soft Storage</h1>
    <p class="subtitle">A quiet place for everything on your mind.</p>
  </header>

  <div class="toolbar">
    <input class="search" id="search" type="search"
      placeholder="Search your little universe..."
      aria-label="Search notes">

    <button class="primary" id="add" type="button">+ New note</button>
    <button class="logout" id="logout" type="button">Log out ↗</button>
  </div>

  <nav class="tabs glass" aria-label="Filter notes">
    <button class="tab active" data-cat="Everything" aria-pressed="true">Everything</button>
    <button class="tab" data-cat="Notes" aria-pressed="false">Notes</button>
    <button class="tab" data-cat="Projects" aria-pressed="false">Projects</button>
    <button class="tab" data-cat="Ideas" aria-pressed="false">Ideas</button>
    <button class="tab" data-cat="Favorites" aria-pressed="false">♥ Favorites</button>
  </nav>

  <section aria-labelledby="heading">
    <div class="heading">
      <h2 id="heading">Everything</h2>
      <span class="count" id="count" aria-live="polite">0 notes</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>Made for your thoughts, plans, and daydreams ✧</footer>
</main>

<dialog id="dialog" aria-labelledby="formTitle">
  <form class="form" id="form">
    <h2 id="formTitle">Create a note</h2>

    <div class="field">
      <label for="title">Title</label>
      <input id="title" maxlength="100"
        placeholder="A little thought..." required>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option>Notes</option>
        <option>Projects</option>
        <option>Ideas</option>
      </select>
    </div>

    <div class="field">
      <label for="content">Your thoughts</label>
      <textarea id="content" maxlength="10000"
        placeholder="Write anything you want..."></textarea>
    </div>

    <div class="dialog-actions">
      <button type="button" class="cancel" id="cancel">Cancel</button>
      <button class="primary" id="saveButton" type="submit">Save note</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function () {
  "use strict";

  const SUPABASE_URL = "https://wnueqirdsfiwltrcwtpf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_EWKj8whQLXCWjDppjyO2AQ_ucECD3b6";
  const STORAGE_KEY = "soft-storage-notes-v1";

  const $ = id => document.getElementById(id);

  // Verify authentication before revealing or initializing the workspace.
  let supabase;

  try {
    if (!window.supabase?.createClient) {
      throw new Error("The authentication library did not load.");
    }

    supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const { data, error } = await supabase.auth.getSession();

    if (error) throw error;

    if (!data.session) {
      window.location.replace("login.html");
      return;
    }
  } catch (error) {
    console.error("Session verification failed:", error);
    window.location.replace("login.html");
    return;
  }

  document.documentElement.classList.add("authenticated");

  let notes = [];
  let categoryFilter = "Everything";
  let editingId = null;
  let originalDraft = "";
  let toastTimeout;
  let signingOut = false;

  // Escape user text before inserting it into HTML.
  const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

  function showToast(message) {
    const toast = $("toast");
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.hidden = true;
    }, 2800);
  }

  function validNote(note) {
    return note &&
      typeof note === "object" &&
      typeof note.id === "string" &&
      typeof note.title === "string" &&
      ["Notes", "Projects", "Ideas"].includes(note.category);
  }

  function loadNotes() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      const parsed = stored ? JSON.parse(stored) : [];

      notes = Array.isArray(parsed)
        ? parsed.filter(validNote).map(note => ({
            id: note.id,
            title: note.title.slice(0, 100),
            category: note.category,
            content: typeof note.content === "string"
              ? note.content.slice(0, 10000) : "",
            favorite: note.favorite === true,
            createdAt: Number(note.createdAt) || Date.now(),
            updatedAt: Number(note.updatedAt) || Date.now()
          }))
        : [];
    } catch (error) {
      console.error("Could not load notes:", error);
      notes = [];
      showToast("Saved notes could not be read from this browser.");
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      return true;
    } catch (error) {
      console.error("Could not save notes:", error);
      showToast("Could not save notes. Browser storage may be full or unavailable.");
      return false;
    }
  }

  function formatDate(timestamp) {
    const date = new Date(timestamp);

    return Number.isNaN(date.getTime())
      ? ""
      : date.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric"
        });
  }

  function render() {
    const query = $("search").value.trim().toLocaleLowerCase();

    const items = notes
      .filter(note => {
        const matchesCategory =
          categoryFilter === "Everything" ||
          (categoryFilter === "Favorites" && note.favorite) ||
          note.category === categoryFilter;

        const matchesSearch =
          note.title.toLocaleLowerCase().includes(query) ||
          note.content.toLocaleLowerCase().includes(query);

        return matchesCategory && matchesSearch;
      })
      .sort((a, b) => b.updatedAt - a.updatedAt);

    $("heading").textContent = categoryFilter;
    $("count").textContent =
      `${items.length} ${items.length === 1 ? "note" : "notes"}`;

    if (!items.length) {
      const isSearching = query.length > 0;

      $("grid").innerHTML = `
        <div class="empty glass">
          <div class="symbol">✧</div>
          <h3>${isSearching ? "No matching notes" :
            categoryFilter === "Favorites" ? "No favorites yet" :
            "Nothing here just yet"}</h3>
          <p>${isSearching
            ? "Try another search, or clear your search to see your notes."
            : "This little space is waiting for your next thought. Create a note to get started."}</p>
          ${!isSearching && categoryFilter !== "Favorites"
            ? '<button class="primary" id="emptyAdd" type="button">+ Create a note</button>'
            : ""}
        </div>`;

      return;
    }

    $("grid").innerHTML = items.map(note => `
      <article class="note">
        <div class="top">
          <span class="category">${esc(note.category)}</span>
          <button class="fav ${note.favorite ? "yes" : ""}"
            data-do="fav" data-id="${esc(note.id)}"
            aria-label="${note.favorite ? "Remove from" : "Add to"} favorites"
            aria-pressed="${note.favorite}">${note.favorite ? "♥" : "♡"}</button>
        </div>
        <h3>${esc(note.title)}</h3>
        <p>${esc(note.content)}</p>
        <div class="bottom">
          <span class="date">${formatDate(note.updatedAt)}</span>
          <div class="actions">
            <button class="small" data-do="edit"
              data-id="${esc(note.id)}">Edit</button>
            <button class="small delete" data-do="del"
              data-id="${esc(note.id)}">Delete</button>
          </div>
        </div>
      </article>
    `).join("");
  }

  function draftSnapshot() {
    return JSON.stringify({
      title: $("title").value,
      category: $("category").value,
      content: $("content").value
    });
  }

  function openNote(note = null) {
    editingId = note ? note.id : null;
    $("form").reset();

    $("formTitle").textContent = note ? "Edit your note" : "Create a note";
    $("saveButton").textContent = note ? "Save changes" : "Save note";

    if (note) {
      $("title").value = note.title;
      $("category").value = note.category;
      $("content").value = note.content;
    }

    originalDraft = draftSnapshot();
    $("dialog").showModal();
    $("title").focus();
  }

  function closeEditor() {
    $("dialog").close();
    editingId = null;
    $("add").focus();
  }

  $("add").addEventListener("click", () => openNote());

  $("cancel").addEventListener("click", () => {
    if (draftSnapshot() !== originalDraft &&
        !confirm("Discard your unsaved changes?")) {
      return;
    }

    closeEditor();
  });

  $("dialog").addEventListener("cancel", event => {
    if (draftSnapshot() !== originalDraft &&
        !confirm("Discard your unsaved changes?")) {
      event.preventDefault();
    }
  });

  $("form").addEventListener("submit", event => {
    event.preventDefault();

    const title = $("title").value.trim();

    if (!title) {
      $("title").focus();
      return;
    }

    const now = Date.now();

    const changes = {
      title: title.slice(0, 100),
      category: $("category").value,
      content: $("content").value.slice(0, 10000),
      updatedAt: now
    };

    let previousNotes = notes;

    if (editingId) {
      notes = notes.map(note =>
        note.id === editingId ? { ...note, ...changes } : note
      );
    } else {
      notes = [{
        id: (crypto.randomUUID
          ? crypto.randomUUID()
          : now.toString(36) + Math.random().toString(36).slice(2)),
        ...changes,
        favorite: false,
        createdAt: now
      }, ...notes];
    }

    if (!saveNotes()) {
      notes = previousNotes;
      return;
    }

    render();
    closeEditor();
    showToast(editingId ? "Your changes have been saved." : "Your new note is saved.");
  });

  $("search").addEventListener("input", render);

  document.querySelector(".tabs").addEventListener("click", event => {
    const button = event.target.closest("button[data-cat]");
    if (!button) return;

    categoryFilter = button.dataset.cat;

    document.querySelectorAll(".tab").forEach(tab => {
      const active = tab === button;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-pressed", String(active));
    });

    render();
  });

  $("grid").addEventListener("click", event => {
    const emptyAdd = event.target.closest("#emptyAdd");

    if (emptyAdd) {
      openNote();
      return;
    }

    const button = event.target.closest("button[data-do]");
    if (!button) return;

    const note = notes.find(item => item.id === button.dataset.id);
    if (!note) return;

    switch (button.dataset.do) {
      case "edit":
        openNote(note);
        break;

      case "fav": {
        const oldFavorite = note.favorite;
        const oldUpdatedAt = note.updatedAt;

        note.favorite = !note.favorite;
        note.updatedAt = Date.now();

        if (!saveNotes()) {
          note.favorite = oldFavorite;
          note.updatedAt = oldUpdatedAt;
          return;
        }

        render();
        showToast(note.favorite
          ? "Added to your favorites."
          : "Removed from your favorites.");
        break;
      }

      case "del":
        if (!confirm(`Delete "${note.title}"? This cannot be undone.`)) {
          return;
        }

        {
          const previousNotes = notes;
          notes = notes.filter(item => item.id !== note.id);

          if (!saveNotes()) {
            notes = previousNotes;
            return;
          }

          render();
          showToast("Note deleted.");
        }
        break;
    }
  });

  $("logout").addEventListener("click", async () => {
    if (signingOut) return;

    signingOut = true;
    $("logout").disabled = true;
    $("logout").textContent = "Logging out…";

    try {
      const { error } = await supabase.auth.signOut();

      if (error) throw error;

      window.location.replace("login.html");
    } catch (error) {
      console.error("Logout failed:", error);
      showToast("Could not log out. Please try again.");
      signingOut = false;
      $("logout").disabled = false;
      $("logout").textContent = "Log out ↗";
    }
  });

  // If the session is explicitly signed out in another part of the app,
  // return to the login screen.
  supabase.auth.onAuthStateChange(event => {
    if (event === "SIGNED_OUT" && !signingOut) {
      window.location.replace("login.html");
    }
  });

  loadNotes();
  render();
})();
</script>
</body>
</html>
